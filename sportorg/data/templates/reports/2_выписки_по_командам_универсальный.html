{% extends "base.html" %}
{% block title %}Team list{% endblock %}
{% block head %}
{{ super() }}
<style>
    @page {
        size: A4 portrait;
        margin: 8mm;
    }

    .team-page {
        box-sizing: border-box;
        min-height: 281mm;
        break-after: page;
        page-break-after: always;
    }

    .team-page:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .team-page-pair {
        display: grid;
        grid-template-rows: repeat(2, 139mm);
        gap: 3mm;
        align-content: start;
    }

    .team-slot {
        min-height: 139mm;
        box-sizing: border-box;
        padding-bottom: 2mm;
        border-bottom: 1px solid #999;
        break-inside: avoid;
        page-break-inside: avoid;
    }

    .team-block {
        display: flow-root;
    }

    .team-page-large {
        display: flex;
        flex-direction: column;
    }

    .team-page-large-bottom .team-block {
        margin-top: auto;
    }

    .team-measure-container {
        position: absolute;
        top: 0;
        left: -10000px;
        width: 194mm;
        font-size: 85%;
        visibility: hidden;
    }

    .team-measure-container h1,
    .team-measure-container h2,
    .team-measure-container h3,
    .team-measure-container h4,
    .team-measure-container h5,
    .team-measure-container h6 {
        margin: 1px 0;
    }

    .team-measure-container table.sportorg-table {
        display: table;
        width: 100%;
        margin-bottom: 1px;
    }

    .team-measure-container table.sportorg-table th,
    .team-measure-container table.sportorg-table td {
        padding: 1px 10px;
    }

    .team-measure-container pre {
        margin-bottom: 1px;
    }

    .team-block h2 {
        font-size: 10pt;
        overflow-wrap: anywhere;
    }
</style>
{% endblock %}

{% block content %}
<div
    id="org-list-tables"
    data-race="{{ race|tojson|forceescape }}"
    data-rent-cards="{{ rent_cards|tojson|forceescape }}"
    data-selected="{{ selected|tojson|forceescape }}"
></div>
<script>
    var reportElement = document.getElementById('org-list-tables');
    var race = JSON.parse(reportElement.dataset.race);
    var rent_cards = JSON.parse(reportElement.dataset.rentCards);
    var selected = JSON.parse(reportElement.dataset.selected);
    racePreparation(race);

    function getStartListByOrg(org, sort) {
        var results = [];
        for (var _i = 0, _a = race.persons; _i < _a.length; _i++) {
            var person = _a[_i];
            if (!org || person.organization && person.organization.id === org.id) {
                if (!selected.persons.length || selected.persons.some(function (elem) {
                            return elem.id === person.id;
                        })) {
                    person.is_rented_card = person.is_rented_card || rent_cards.indexOf(person.card_number) !== -1;
                    results.push({
                        name: person.surname + ' ' + person.name + (person.is_out_of_competition ? ' *' : ''),
                        group: (person.group && person.group.name) || '',
                        qual: Qualification[person.qual],
                        bib: person.bib,
                        card_number: person.card_number + (person.is_rented_card ? ' *' : ''),
                        year: person.birth_date ? (new Date(person.birth_date)).getFullYear() : '',
                        start: toHHMMSS(person.start_time),
                        start_time: person.start_time,
                        comment: person.comment,
                        price: person.group && person.group.price,
                        price_show: person.group && person.group.price + (person.is_paid ? ' *' : ''),
                        person: person
                    });
                }
            }
        }
        var sortFunc = function (a, b) {
            var nameA = a.name && a.name.toLowerCase() || '';
            var nameB = b.name && b.name.toLowerCase() || '';
            if (nameA < nameB)
                return -1;
            if (nameA > nameB)
                return 1;
            return 0;
        };
        if (sort === 'bib') {
            sortFunc = function (a, b) {
                return a.bib - b.bib;
            }
        } else if (sort === 'group') {
            sortFunc = function (a, b) {
                var nameA = a.group.toLowerCase() || '';
                var nameB = b.group.toLowerCase() || '';
                if (nameA < nameB)
                    return -1;
                if (nameA > nameB)
                    return 1;
                return 0;
            };
        } else if (sort === 'time') {
            sortFunc = function (a, b) {
				if (a.start_time != b.start_time){
					return a.start_time - b.start_time;
				}
				var nameA = a.name && a.name.toLowerCase() || '';
				var nameB = b.name && b.name.toLowerCase() || '';
				if (nameA < nameB)
					return -1;
				if (nameA > nameB)
					return 1;
				return 0;
            };
        }
        results.sort(sortFunc);
        var index = 0;
        results.forEach(function (elem) {
            index++;
            elem.index = index
        });
        return results;
    }

    var Fields = {
        fields: [
            {key: 'index', title: '№', size: 4},
            {key: 'name', title: 'Фамилия, имя', size: 32},
            {key: 'group', title: 'Группа', size: 10},
            {key: 'year', title: 'ГР', size: 4},
            {key: 'qual', title: 'Разряд', size: 6},
            {key: 'bib', title: 'Номер', size: 6},
            {key: 'card_number', title: 'Номер чипа', size: 11},
            {key: 'start', title: 'Cтарт', size: 9},
            {key: 'price_show', title: 'Взнос', size: 6},
            {key: 'comment', title: 'Прим.', size: 30, active: false}
        ],
        active: function (key, val) {
            for (var _i = 0, _a = this.fields; _i < _a.length; _i++) {
                var obj = _a[_i];
                if (key === obj.key) {
                    obj.active = val;
                }
            }
        },
        isActive: function (key) {
            for (var _i = 0, _a = this.fields; _i < _a.length; _i++) {
                var obj = _a[_i];
                if (key === obj.key) {
                    if (obj.active === void 0) {
                        return true;
                    }
                    else {
                        return !!obj.active;
                    }
                }
            }
            return false;
        },
        init: function () {
            return this;
        }
    }.init();

    var store = {
        largeTeamPosition: 'top'
    };
    var HALF_PAGE_HEIGHT = '137mm';

    function render(sort, noCombine) {
        if (sort) {
            store.sort = sort;
        }
        if (typeof noCombine === 'boolean') {
            store.noCombine = noCombine;
        }

        var getInfoBlock = function (rows) {
            var price = 0;
            var paid = 0;
            var rentedSportidentCards = 0;
            rows.forEach(function (row) {
                price += +row.price;
                if (row.person.is_rented_card) {
                    rentedSportidentCards++;
                }
                if (row.person.is_paid) {
                    paid += +row.price;
                }
            });
            var infoBlock = document.createElement('div');
            if (price && Fields.isActive('price_show')) {
                infoBlock.appendChild(document.createTextNode('Стартовый взнос: ' + price + (paid ? ' - ' + paid + ' = ' + (price - paid) : '')));
                infoBlock.appendChild(document.createElement('br'));
            }
            if (rentedSportidentCards) {
                infoBlock.appendChild(document.createTextNode('Арендованных ЧИПов: ' + rentedSportidentCards));
            }
            return infoBlock;
        };

        var makeTable = function (rows) {
            if (store.tableView) {
                return new TableGenerator(rows, Fields.fields).getTable({className: 'sportorg-table'});
            }
            return new TableTextGenerator(rows, Fields.fields).getTable();
        };

        var makePageBreak = function () {
            var newPage = document.createElement('div');
            newPage.className = 'new-page';
            return newPage;
        };

        var makeTeamBlock = function (block) {
            var teamBlock = document.createElement('div');
            teamBlock.className = 'team-block';

            var titleBlock = document.createElement('h2');
            titleBlock.id = block.org.name;
            titleBlock.appendChild(document.createTextNode(
                dateFormat(race.data.start_datetime) + ' / ' + block.org.name + ' / ' + block.org.contact
            ));

            teamBlock.appendChild(titleBlock);
            teamBlock.appendChild(makeTable(block.rows));
            teamBlock.appendChild(getInfoBlock(block.rows));
            return teamBlock;
        };

        var resultBlock = document.getElementById('org-list-tables');
        resultBlock.innerHTML = '';
        resultBlock.className = '';
        if (store.noCombine) {
            var rows = getStartListByOrg(null, store.sort);
            resultBlock.appendChild(makeTable(rows));
            resultBlock.appendChild(getInfoBlock(rows));
            return;
        }

        var blocks = [];
        race.organizations.forEach(function (org) {
            var rows = getStartListByOrg(org, store.sort);
            if (rows.length) {
                blocks.push({
                    org: org,
                    rows: rows
                });
            }
        });

        if (!store.twoPerPage) {
            blocks.forEach(function (block, index) {
                resultBlock.appendChild(makeTeamBlock(block));
                if (index < blocks.length - 1) {
                    resultBlock.appendChild(makePageBreak());
                }
            });
            return;
        }

        resultBlock.className = 'two-per-page';

        var measurementContainer = document.createElement('div');
        measurementContainer.className = 'team-measure-container two-per-page';
        var halfPageMarker = document.createElement('div');
        halfPageMarker.style.height = HALF_PAGE_HEIGHT;
        measurementContainer.appendChild(halfPageMarker);
        document.body.appendChild(measurementContainer);
        var halfPageHeight = halfPageMarker.getBoundingClientRect().height;
        var measuredBlocks = blocks.map(function (block) {
            var element = makeTeamBlock(block);
            measurementContainer.appendChild(element);
            var height = element.getBoundingClientRect().height;
            measurementContainer.removeChild(element);
            return {element: element, height: height};
        });
        document.body.removeChild(measurementContainer);

        var currentPage = null;
        var currentSlot = 0;
        measuredBlocks.forEach(function (block) {
            if (block.height > halfPageHeight) {
                currentPage = null;
                currentSlot = 0;

                var largePage = document.createElement('div');
                largePage.className = 'team-page team-page-large';
                if (store.largeTeamPosition === 'bottom') {
                    largePage.className += ' team-page-large-bottom';
                }
                largePage.appendChild(block.element);
                resultBlock.appendChild(largePage);
                return;
            }

            if (!currentPage || currentSlot === 2) {
                currentPage = document.createElement('div');
                currentPage.className = 'team-page team-page-pair';
                resultBlock.appendChild(currentPage);
                currentSlot = 0;
            }

            var slot = document.createElement('div');
            slot.className = 'team-slot';
            slot.appendChild(block.element);
            currentPage.appendChild(slot);
            currentSlot++;
        });
    }
    render();
    new SettingsGenerator([
        {
            title: 'Табличный вид',
            value: !!store.tableView,
            change: function (checked) {
                store.tableView = checked;
                render()
            }
        },
        {
            title: 'Номер',
            value: Fields.isActive('bib'),
            change: function (checked) {
                Fields.active('bib', checked);
                render()
            }
        },
        {
            title: 'Номер чипа',
            value: Fields.isActive('card_number'),
            change: function (checked) {
                Fields.active('card_number', checked);
                render()
            }
        },
        {
            title: 'Стартовый взнос',
            value: Fields.isActive('price_show'),
            change: function (checked) {
                Fields.active('price_show', checked);
                render()
            }
        },
        {
            title: 'Комментарий',
            value: Fields.isActive('comment'),
            change: function (checked) {
                Fields.active('comment', checked);
                render()
            }
        },
        {
            title: 'Объединить по коллективам',
            value: true,
            change: function (checked) {
                render(null, !checked)
            }
        },
        {
            title: 'Две команды на листе (сверху и снизу)',
            value: !!store.twoPerPage,
            change: function (checked) {
                store.twoPerPage = checked;
                render()
            }
        },
        {
            title: 'Большие команды располагать:',
            value: [
                {text: 'сверху', value: 'top'},
                {text: 'снизу', value: 'bottom'}
            ],
            change: function (arr) {
                store.largeTeamPosition = arr[0];
                render();
            }
        },
        {
            title: 'Сортировать участников по: ',
            value: [
                {text: 'имени', value: 'name'},
                {text: 'номеру', value: 'bib'},
                {text: 'группе', value: 'group'},
				{text: 'времени', value: 'time'}
            ],
            change: function (arr) {
                render(arr[0]);
            }
        }
    ]).show();
</script>
{% endblock %}
{% block footer %}{% endblock %}
